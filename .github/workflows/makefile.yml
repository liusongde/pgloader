name: Build pgloader on aarch64

on:
  push:
    branches: [main, master, liusongde-patch-1]
  pull_request:
    branches: [main, master, liusongde-patch-1]

jobs:
  build-pgloader-aarch64:
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}  # 动态获取当前分支

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            libssl-dev \
            libpq-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libxslt1-dev \
            libyaml-dev \
            libglib2.0-dev \
            libffi-dev \
            sbcl  # 合并SBCL安装到依赖步骤

      - name: Build pgloader
        run: |
          # 使用当前仓库代码，无需额外克隆
          cd ${{ github.workspace }}
          make

      - name: Verify binary
        run: |
          ls -la pgloader
          ./pgloader --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgloader-aarch64-binary
          path: ./pgloader
          retention-days: 14
