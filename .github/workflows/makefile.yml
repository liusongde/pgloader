
name: Build pgloader on aarch64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-pgloader-aarch64:
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libssl-dev libpq-dev libsqlite3-dev libcurl4-openssl-dev libxml2-dev libxslt1-dev libyaml-dev libglib2.0-dev libffi-dev

      - name: Install SBCL (Steel Bank Common Lisp)
        run: |
          sudo apt-get install -y sbcl

      - name: Clone pgloader source
        run: |
          git clone https://github.com/dimitri/pgloader.git
          cd pgloader
          git checkout v3.6.2  # 使用稳定版本，避免主分支变动

      - name: Build pgloader
        working-directory: ./pgloader
        run: |
          make

      - name: Verify binary
        working-directory: ./pgloader
        run: |
          ls -la pgloader
          ./pgloader --version

      - name: Upload pgloader binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgloader-aarch64-binary
          path: pgloader/pgloader
          retention-days: 14
